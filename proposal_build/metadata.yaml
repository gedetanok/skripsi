abstrak-id: |
  Di kalangan dewasa usia produktif, diabetic retinopathy (DR)
  merupakan salah satu penyebab utama kehilangan penglihatan yang dapat
  dicegah, dan prevalensinya di Indonesia terus meningkat meskipun
  jumlah oftalmolog per kapita masih jauh dari cukup untuk menopang
  skrining fundus tahunan. Walaupun deep learning kini mampu
  mengklasifikasikan tingkat keparahan DR dari citra fundus dengan
  akurasi tinggi, penelitian pada umumnya menetapkan teknik
  preprocessing dan arsitektur backbone berdasarkan kebiasaan alih-alih
  perbandingan terkontrol, dan memvalidasi pilihan tersebut hanya pada
  satu dataset, sehingga validitas pilihan itu secara lebih luas belum
  teruji. Penelitian ini menjalankan perbandingan faktorial 5x2 yang
  memasangkan lima teknik preprocessing citra fundus (CLAHE, Ben Graham
  preprocessing, Adaptive Sigmoid Enhancement, LAB-ACE, dan
  Multi-channel Image Enhancement) dengan dua backbone (ResNet-50 dan
  Vision Transformer ViT-B/16) untuk menghasilkan sepuluh konfigurasi,
  yang masing-masing dilatih dan dievaluasi secara terpisah pada enam
  dataset publik yang berbagi ontologi ICDR lima tingkat (IDRiD, DDR,
  APTOS 2019, Messidor-2, EyePACS, dan DeepDRiD). Kinerja diukur dengan
  akurasi, quadratic-weighted kappa, dan macro-F1; skor per dataset
  kemudian digabungkan pada keenam dataset dengan uji Friedman, dan dua
  konfigurasi terdepan dibandingkan dengan uji Wilcoxon signed-rank
  antardataset serta uji McNemar per dataset (dengan koreksi
  Holm-Bonferroni) pada prediksi berpasangan, guna menemukan konfigurasi
  yang tetap terbaik antardataset alih-alih hanya pada salah satunya.
  Grad-CAM akhirnya diterapkan pada konfigurasi terdepan tersebut untuk
  mengungkap area lesi yang menjadi dasar prediksinya. Luaran yang
  diharapkan adalah panduan berbasis bukti yang reproducible mengenai
  pasangan preprocessing dan backbone yang paling sesuai untuk skrining
  DR otomatis pada layanan kesehatan primer di Indonesia.

kata-kunci-id: "diabetic retinopathy, preprocessing citra fundus, deep learning, arsitektur backbone, perbandingan lintas-dataset"

abstract-en: |
  Among working-age adults, diabetic retinopathy (DR) ranks as a foremost
  preventable cause of vision loss, and its prevalence in Indonesia keeps
  climbing even though the number of ophthalmologists per capita falls
  well short of what annual fundus screening would demand. Although deep
  learning now grades DR severity from fundus images with considerable
  accuracy, studies typically fix their preprocessing technique and
  backbone architecture by convention rather than by controlled
  comparison, and they confirm whatever choice they make on a single
  dataset, so the wider validity of that choice stays untested. The
  present work runs a 5x2 factorial comparison in which five fundus-image
  preprocessing techniques (CLAHE, Ben Graham preprocessing, Adaptive
  Sigmoid Enhancement, LAB-ACE, and Multi-channel Image Enhancement) are
  crossed with two backbones (ResNet-50 and Vision Transformer ViT-B/16)
  to yield ten configurations, each trained and evaluated separately on
  six public datasets that share the five-grade ICDR ontology (IDRiD,
  DDR, APTOS 2019, Messidor-2, EyePACS, and DeepDRiD). Performance is
  measured by accuracy, quadratic-weighted kappa, and macro-F1; the
  per-dataset scores are then combined across the six datasets with the
  Friedman test, and the two leading configurations are compared with the
  Wilcoxon signed-rank test across datasets and with per-dataset McNemar
  tests (Holm-Bonferroni corrected) on the paired predictions, in order to
  pinpoint the configuration that remains best across datasets rather
  than on any one of them. Grad-CAM is finally applied to that leading
  configuration to reveal the lesion regions that drive its predictions.
  The intended outcome is reproducible, evidence-based guidance on which
  preprocessing-and-backbone pairings are most appropriate for automated
  DR screening in Indonesian primary-care settings.

keywords-en: "diabetic retinopathy, fundus image preprocessing, deep learning, backbone architecture, multi-dataset comparison"
