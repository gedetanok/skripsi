abstract-en: |
  Diabetic retinopathy (DR) is a foremost preventable cause of vision loss
  among working-age adults, and its prevalence in Indonesia keeps rising
  even as ophthalmologist supply per capita falls well short of what
  annual fundus screening demands. Although deep learning now grades DR
  severity from fundus images with considerable accuracy, studies
  typically fix their preprocessing technique and backbone architecture by
  convention rather than by controlled comparison, and confirm that choice
  on a single dataset, so its wider validity stays untested. This study
  runs a 5x2 factorial comparison in which five preprocessing techniques
  (CLAHE, Ben Graham preprocessing, Adaptive Sigmoid Enhancement, LAB-ACE,
  and Multi-channel Image Enhancement) are crossed with two backbones
  (ResNet-50 and Vision Transformer ViT-B/16), giving ten configurations,
  each trained and evaluated separately on six public datasets that share
  the five-grade ICDR ontology (IDRiD, DDR, APTOS 2019, Messidor-2,
  EyePACS, and DeepDRiD). Performance is measured by accuracy,
  quadratic-weighted kappa, and macro-F1; the per-dataset scores are
  aggregated with the Friedman test, and the two leading configurations
  are compared with the Wilcoxon signed-rank test across datasets and
  per-dataset McNemar tests (Holm-Bonferroni corrected), to pinpoint the
  configuration that stays best across datasets rather than on any single
  one. Grad-CAM is applied to that configuration to reveal the lesion
  regions behind its predictions. By pairing a like-for-like preprocessing
  comparison with formal cross-dataset statistical testing, an approach
  not previously applied to this problem, the study is expected to deliver
  reproducible, evidence-based guidance on the preprocessing-and-backbone
  pairings most appropriate for automated DR screening in Indonesian
  primary care.

keywords-en: "diabetic retinopathy, fundus image preprocessing, deep learning, backbone architecture, multi-dataset comparison"
